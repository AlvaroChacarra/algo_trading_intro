        "id": "notation.mid",
        "symbol": "mid = (bid + ask) / 2",
        "meaning": "top-of-book midpoint"
      },
      {
        "id": "notation.imbalance",
        "symbol": "I = (Vb - Va) / (Vb + Va)",
        "meaning": "normalized depth imbalance"
      },
      {
        "id": "notation.cash_flow",
        "symbol": "cash_flow = ± price × size",
        "meaning": "signed cash movement"
      },
      {
        "id": "notation.equity",
        "symbol": "equity = cash + q × mark",
        "meaning": "marked portfolio value"
      },
      {
        "id": "notation.slippage_signed",
        "symbol": "slippage = side_sign × (fill_price - arrival_mid)",
        "meaning": "positive means worse execution"
      },
      {
        "id": "notation.twap",
        "symbol": "w_t = 1 / T",
        "meaning": "uniform time weights"
      },
      {
        "id": "notation.vwap",
        "symbol": "w_t = volume_t / Σ volume",
        "meaning": "volume-profile weights"
      },
      {
        "id": "notation.inventory",
        "symbol": "q",
        "meaning": "signed market-maker inventory"
      },
      {
        "id": "notation.heuristic_reservation",
        "symbol": "r = mid - φq",
        "meaning": "heuristic quote center"
      },
      {
        "id": "notation.cara_utility",
        "symbol": "U(W) = -exp(-γW)",
        "meaning": "CARA utility and risk-aversion parameter"
      },
      {
        "id": "notation.fill_intensity",
        "symbol": "λ(δ) = A exp(-κδ)",
        "meaning": "fill intensity decays with quote distance"
      },
      {
        "id": "notation.as_reservation_price",
        "symbol": "r = s - qγσ²τ",
        "meaning": "A-S reservation price"
      },
      {
        "id": "notation.as_optimal_spread",
        "symbol": "δ = γσ²τ + (2/γ) ln(1 + γ/κ)",
        "meaning": "A-S optimal full spread"
      }
