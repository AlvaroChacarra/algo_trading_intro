  "recalls": [
    {
      "concept": "market_making.heuristic_reservation_price",
      "introduced_in": 13,
      "mapping": {
        "before": "r = mid - skew_heurístico × inventario",
        "now": "r = s - q γ σ² τ expresa el mismo control con unidades."
      }
    },
    {
      "concept": "framework.strategy_contract",
      "introduced_in": 10,
      "mapping": {
        "before": "on_book_update devuelve acciones y on_fill actualiza el estado.",
        "now": "A-S cambia las fórmulas dentro del mismo ciclo de vida."
      }
    },
    {
      "concept": "market_making.cara_utility",
      "introduced_in": 13,
      "mapping": {
        "before": "CARA dio a γ el significado de aversión al riesgo.",
        "now": "γ controla cuánto desplazan riesgo e inventario el centro A-S."
      }
    },
    {
      "concept": "market_making.fill_intensity",
      "introduced_in": 13,
      "mapping": {
        "before": "λ(δ)=A·exp(−κδ) hizo visible la caída de fills con la distancia.",
        "now": "κ entra en el ancho óptimo y cuantifica ese mismo trade-off."
      }
    }
  ],
