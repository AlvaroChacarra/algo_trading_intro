name: curso

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Job rápido: el contrato del repo (cada push) ──────────────────────────
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Validar el contrato pedagógico del curso completo
        run: python pedagogy_check.py

      - name: Verificar informes de continuidad generados
        run: python framework/_build/pedagogy_reports.py --check

      - name: Instalar dependencias de test fijadas
        run: "pip install --requirement requirements-pages-lock.txt --require-hashes --only-binary=:all:"

      - name: Tests del motor, Pages y contratos
        run: cd framework && python -m pytest tests/ -q

      - name: Fuzz determinista de atomicidad del matching
        run: >-
          python framework/_build/fuzz_matching.py
          --seed 20260828 --cases 120000

      - name: Smoke test end-to-end
        run: cd framework && python smoke_test.py

      - name: Autovalidar los ejercicios (solución + validador)
        run: python framework/_build/build_course.py --check-only

      - name: Los .py consolidados corren
        run: |
          set -e
          (cd 01-python-i-data-model/exercises && python trading_snapshot.py > /dev/null)
          (cd 02-python-ii-functional-book/exercises && python order_book.py > /dev/null)
          (cd 03-python-iii-modules/exercises && python main.py > /dev/null)
          (cd 03-python-iii-modules/exercises && python demo_guarded.py > /dev/null)
          (cd 04-oop-i-order-trade/exercises && python orders_demo.py > /dev/null)
          (cd 05-oop-ii-book-portfolio/exercises && python book_demo.py > /dev/null)
          (cd 06-oop-iii-inheritance/exercises && python strategies_toy.py > /dev/null)
          (cd 07-microstructure-reading-book/exercises && python read_book.py > /dev/null)
          (cd 08-order-types-matching/exercises && python matching_demo.py > /dev/null)
          (cd 09-market-simulation-loop/exercises && python run_day.py > /dev/null)
          (cd 10-strategy-framework/exercises && python run_backtest.py > /dev/null)
          (cd 11-first-strategy-metrics/exercises && python judge.py > /dev/null)
          (cd 12-vwap-execution/exercises && python run_vwap.py > /dev/null)
          (cd 13-market-making-intro/exercises && python run_mm.py > /dev/null)
          (cd 14-avellaneda-stoikov/exercises && python mm_sweep.py > /dev/null)
          (cd 14-avellaneda-stoikov/exercises && python capstone_check.py > /dev/null)

      - name: Regenerar y comprobar que nada se editó a mano
        run: |
          python framework/_build/build_course.py
          (cd 15-final-exam && python generate_exam.py)
          status_file="$RUNNER_TEMP/course-regeneration-status.txt"
          git status --porcelain=v1 --untracked-files=all > "$status_file"
          if [ -s "$status_file" ]; then
            echo '::error::El material generado no coincide con los specs o contiene salidas no versionadas. Edita el spec, regenera y versiona todas las salidas públicas.'
            sed -n '1,200p' "$status_file"
            exit 1
          fi

  # ── Job e2e: runtime completo, geometría y documentos ───────────────────
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.4"
          cache: npm
      - name: Instalar dependencias Node fijadas
        run: npm ci
      - name: Validar el contrato cerrado de evidencia desktop
        run: npm run test:desktop-contract
      - name: Instalar Chromium fijado por Playwright
        run: |
          npx --no-install playwright install --with-deps chromium
      - name: Abrir los 15 documentos y fallar ante cualquier error de página
        run: node framework/_build/e2e_check.js
      - name: Validar aula/estudio, teclado y geometría en L1-L14
        run: node framework/_build/desktop_e2e.js --audit-dir artifacts/work2-full-course-scaleout
      - name: Validar independientemente la evidencia desktop
        if: always()
        run: node framework/_build/validate_desktop_audit.js --verify-browser artifacts/work2-full-course-scaleout
      - name: Conservar evidencia desktop canónica
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: work2-full-course-scaleout-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/work2-full-course-scaleout
          include-hidden-files: true
          if-no-files-found: error
      - name: Conservar evidencia desktop forense del fallo
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: work2-full-course-scaleout-forensic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/work2-full-course-scaleout
          include-hidden-files: true
          if-no-files-found: warn
