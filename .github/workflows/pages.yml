name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar conversor de notebooks
        run: pip install -r requirements-pages.txt
      - name: Construir el site estático
        run: python framework/_build/build_pages.py --output _site
      - name: Validar HTML, enlaces y base path
        run: python framework/_build/check_pages.py _site --base-path /algo_trading_intro/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar la experiencia móvil en WebKit
        run: |
          npm install playwright@1.62.1
          npx playwright install --with-deps webkit
          node framework/_build/pages_e2e.js _site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
