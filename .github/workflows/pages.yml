name: pages

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar el artefacto de esta rama en GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Construir el site estático
        run: python framework/_build/build_pages.py --output _site
      - name: Validar HTML, enlaces y base path
        run: python framework/_build/check_pages.py _site --base-path /algo_trading_intro/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar presentaciones de escritorio y catálogo en WebKit
        run: |
          npm install playwright@1.62.1
          npx playwright install --with-deps webkit
          node framework/_build/pages_e2e.js _site --audit-dir artifacts/pages-review
      - name: Conservar evidencia visual de Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-review
          path: artifacts/pages-review
          if-no-files-found: warn
      - if: github.repository == 'AlvaroChacarra/algo_trading_intro' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.repository == 'AlvaroChacarra/algo_trading_intro' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: >-
      github.repository == 'AlvaroChacarra/algo_trading_intro' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Production checks use the deployed revision, not an unmerged source PR.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Comprobar Pages publicado y descargas
        run: |
          npm install playwright@1.62.1
          npx playwright install --with-deps webkit
          node framework/_build/pages_e2e.js _site --live-url https://alvarochacarra.github.io/algo_trading_intro/ --audit-dir artifacts/pages-live
      - name: Conservar evidencia del despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live
          path: artifacts/pages-live
          if-no-files-found: warn
